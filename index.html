<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyJump">
  
  <title>MyJump Web App</title>
  
  <script src="https://unpkg.com/mediainfo.js/dist/mediainfo.min.js"></script>
  
  <style>
    body { 
      font-family: -apple-system, sans-serif; 
      margin: 0; 
      background: #121212; 
      color: white; 
      display: flex; 
      flex-direction: column; 
      height: 100vh; 
      overflow: hidden; 
    }
    
    header { 
      background: #0a0a0a; 
      padding: 20px; 
      text-align: center; 
      font-size: 22px; 
      font-weight: 800; 
      border-bottom: 1px solid #333;
    }
    
    .video-container { 
      width: 100%; 
      background: #000; 
      height: 35vh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      position: relative;
    }
    
    video { 
      max-width: 100%; 
      max-height: 100%; 
    }
    
    .controls { 
      padding: 15px 20px; 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      flex-grow: 1; 
      overflow-y: auto;
    }
    
    .row { 
      display: flex; 
      justify-content: space-between; 
      gap: 10px; 
    }
    
    button, .btn-label { 
      flex: 1; 
      padding: 12px; 
      border: none; 
      border-radius: 12px; 
      font-size: 15px; 
      font-weight: bold; 
      color: white; 
      cursor: pointer; 
      text-align: center; 
      box-sizing: border-box; 
      display: block; 
      transition: 0.2s;
    }
    
    button:active, .btn-label:active { 
      transform: scale(0.95); 
      opacity: 0.8; 
    }
    
    .btn-red { background: #ff3b30; }
    .btn-blue { background: #007aff; }
    .btn-orange { background: #ff9500; }
    .btn-purple { background: #af52de; }
    
    .scrub-btn { 
      background: #333; 
      font-size: 20px; 
      padding: 10px; 
    }

    .fps-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1c1c1e;
      padding: 10px 15px;
      border-radius: 12px;
    }

    select {
      background: #333;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      outline: none;
    }
    
    .result { 
      text-align: center; 
      padding: 20px; 
      background: #1c1c1e; 
      border-top-left-radius: 25px; 
      border-top-right-radius: 25px; 
      box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
    }
    
    .height-text { 
      font-size: 50px; 
      color: #32d74b; 
      font-weight: 900; 
      margin: 0;
    }
    
    input[type="file"] { 
      display: none; 
    }
  </style>
</head>
<body>

  <header>MyJump</header>

  <div class="video-container">
    <video id="videoPlayer" playsinline controls></video>
  </div>

  <div class="controls">
    
    <div class="row">
      <label class="btn-label btn-red">
        🔴 Grabar
        <input type="file" accept="video/*" capture="environment" id="videoCamera">
      </label>
      
      <label class="btn-label btn-blue">
        📁 Galería
        <input type="file" accept="video/*" id="videoGallery">
      </label>
    </div>

    <div class="fps-container">
      <div style="display: flex; flex-direction: column; text-align: left;">
        <span style="font-size: 14px; color: #a1a1a6; font-weight: bold;">Calidad del vídeo:</span>
        <span id="infoEstado" style="font-size: 12px; color: #ff9500; margin-top: 3px;">Esperando vídeo...</span>
      </div>
      <select id="fpsSelector">
        <option value="30">30 FPS</option>
        <option value="60">60 FPS</option>
        <option value="120">120 FPS</option>
        <option value="240">240 FPS</option>
      </select>
    </div>

    <div style="text-align: center; font-size: 13px; color: #888;">
      Ajuste fino (Fotograma a fotograma)
    </div>
    
    <div class="row">
      <button class="scrub-btn" onclick="moverVideo(-1)">⏪ Atrás</button>
      <button class="scrub-btn" onclick="moverVideo(1)">Adelante ⏩</button>
    </div>

    <div class="row">
      <button class="btn-orange" onclick="marcarDespegue()">
        1. Despegue<br>
        <span id="txtDespegue" style="font-size:12px; font-weight:normal">--</span>
      </button>
      
      <button class="btn-purple" onclick="marcarAterrizaje()">
        2. Aterrizaje<br>
        <span id="txtAterrizaje" style="font-size:12px; font-weight:normal">--</span>
      </button>
    </div>
  </div>

  <div class="result">
    <div style="color:#a1a1a6; font-size:14px; margin-bottom: 2px;">
      Tiempo en el aire: <span id="txtVuelo">0.000</span> seg
    </div>
    
    <div class="height-text" id="txtAltura">0.0 cm</div>
    
    <div style="font-size:12px; font-weight:800; letter-spacing:1.5px; color:#fff;">
      ALTURA CALCULADA
    </div>
  </div>

  <script>
    const video = document.getElementById('videoPlayer');
    const estadoTexto = document.getElementById('infoEstado');
    let tDespegue = null;
    let tAterrizaje = null;

    // --- MAGIA PURA: Función para extraer los FPS del archivo ---
    function detectarFPS(file) {
      estadoTexto.innerText = "Analizando FPS...";
      estadoTexto.style.color = "#ff9500"; // Naranja

      MediaInfo({ format: 'object' }, (mediainfo) => {
        const getSize = () => file.size;
        const readChunk = (chunkSize, offset) => new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (e) => resolve(new Uint8Array(e.target.result));
          reader.onerror = reject;
          reader.readAsArrayBuffer(file.slice(offset, offset + chunkSize));
        });

        mediainfo.analyzeData(getSize, readChunk)
          .then((result) => {
            let fpsDetectado = null;
            try {
              // Buscamos la pista de vídeo en los metadatos
              const track = result.media.track.find(t => t['@type'] === 'Video');
              if (track && track.FrameRate) {
                // Redondeamos por si el móvil graba a 29.97 o 59.94
                fpsDetectado = Math.round(parseFloat(track.FrameRate)); 
              }
            } catch (error) {
              console.error(error);
            }

            if (fpsDetectado) {
              estadoTexto.innerText = `¡Detectado: ${fpsDetectado} FPS!`;
              estadoTexto.style.color = "#32d74b"; // Verde
              
              const selector = document.getElementById('fpsSelector');
              
              // Si el usuario sube un vídeo con unos FPS raros (ej: 50), lo añadimos a la lista
              let existeEnElMenu = Array.from(selector.options).some(opt => opt.value == fpsDetectado);
              if(!existeEnElMenu) {
                let nuevaOpcion = new Option(fpsDetectado + " FPS (Original)", fpsDetectado);
                selector.add(nuevaOpcion);
              }
              
              // Cambiamos el selector automáticamente
              selector.value = fpsDetectado;
            } else {
              estadoTexto.innerText = "No detectado. Elige abajo.";
              estadoTexto.style.color = "#ff3b30"; // Rojo
            }
          })
          .catch(() => {
            estadoTexto.innerText = "Error al leer. Elige abajo.";
            estadoTexto.style.color = "#ff3b30"; // Rojo
          });
      });
    }

    function procesarVideo(e) {
      const file = e.target.files[0];
      if (!file) return;
      
      const url = URL.createObjectURL(file);
      video.src = url;
      
      // Lanzamos el detector automático de FPS
      detectarFPS(file);

      // Reiniciamos todo
      tDespegue = null; 
      tAterrizaje = null;
      document.getElementById('txtDespegue').innerText = '--';
      document.getElementById('txtAterrizaje').innerText = '--';
      document.getElementById('txtAltura').innerText = '0.0 cm';
      document.getElementById('txtVuelo').innerText = '0.000';
    }

    document.getElementById('videoCamera').addEventListener('change', procesarVideo);
    document.getElementById('videoGallery').addEventListener('change', procesarVideo);

    function moverVideo(direccionFotogramas) {
      const fpsElegidos = parseInt(document.getElementById('fpsSelector').value);
      const tiempoPorFotograma = 1 / fpsElegidos; 
      
      video.pause();
      video.currentTime += (tiempoPorFotograma * direccionFotogramas);
    }

    function marcarDespegue() {
      tDespegue = video.currentTime;
      document.getElementById('txtDespegue').innerText = tDespegue.toFixed(3) + 's';
      calcular();
    }

    function marcarAterrizaje() {
      tAterrizaje = video.currentTime;
      document.getElementById('txtAterrizaje').innerText = tAterrizaje.toFixed(3) + 's';
      calcular();
    }

    function calcular() {
      if (tDespegue !== null && tAterrizaje !== null) {
        let tiempoVuelo = tAterrizaje - tDespegue;
        
        if (tiempoVuelo <= 0) {
          alert("El aterrizaje debe ser posterior al despegue.");
          return;
        }
        
        document.getElementById('txtVuelo').innerText = tiempoVuelo.toFixed(3);
        
        let alturaMetros = ((tiempoVuelo * tiempoVuelo) * 9.8) / 8;
        let alturaCm = alturaMetros * 100;
        
        document.getElementById('txtAltura').innerText = alturaCm.toFixed(1) + ' cm';
      }
    }
  </script>
</body>
</html>
