<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyJump">
  
  <title>MiSalto Web App</title>
  
  <style>
    body { font-family: -apple-system, sans-serif; margin: 0; background: #121212; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background: #0a0a0a; padding: 20px; text-align: center; font-size: 22px; font-weight: 800; border-bottom: 1px solid #333;}
    .video-container { width: 100%; background: #000; height: 40vh; display: flex; justify-content: center; align-items: center; position: relative;}
    video { max-width: 100%; max-height: 100%; }
    .controls { padding: 20px; display: flex; flex-direction: column; gap: 15px; flex-grow: 1; overflow-y: auto;}
    .row { display: flex; justify-content: space-between; gap: 10px; }
    button, .btn-label { flex: 1; padding: 15px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; color: white; cursor: pointer; text-align: center; box-sizing: border-box; display: block; transition: 0.2s;}
    button:active, .btn-label:active { transform: scale(0.95); opacity: 0.8; }
    
    .btn-red { background: #ff3b30; }
    .btn-blue { background: #007aff; }
    .btn-orange { background: #ff9500; }
    .btn-purple { background: #af52de; }
    .scrub-btn { background: #333; font-size: 24px; padding: 10px; }
    
    .result { text-align: center; padding: 25px 20px; background: #1c1c1e; border-top-left-radius: 25px; border-top-right-radius: 25px; box-shadow: 0 -5px 20px rgba(0,0,0,0.5);}
    .height-text { font-size: 55px; color: #32d74b; font-weight: 900; margin: 0;}
    
    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <header>MiSalto</header>

  <div class="video-container">
    <video id="videoPlayer" playsinline controls></video>
  </div>

  <div class="controls">
    <div class="row">
      <label class="btn-label btn-red">
        🔴 Grabar Salto
        <input type="file" accept="video/*" capture="environment" id="videoCamera">
      </label>
      
      <label class="btn-label btn-blue">
        📁 Galería
        <input type="file" accept="video/*" id="videoGallery">
      </label>
    </div>

    <div style="text-align: center; font-size: 13px; color: #888; margin-top: 5px;">Ajuste fino (Fotograma a fotograma)</div>
    <div class="row">
      <button class="scrub-btn" onclick="moverVideo(-0.033)">⏪ Atrás</button>
      <button class="scrub-btn" onclick="moverVideo(0.033)">Adelante ⏩</button>
    </div>

    <div class="row" style="margin-top: 10px;">
      <button class="btn-orange" onclick="marcarDespegue()">1. Despegue<br><span id="txtDespegue" style="font-size:12px; font-weight:normal">--</span></button>
      <button class="btn-purple" onclick="marcarAterrizaje()">2. Aterrizaje<br><span id="txtAterrizaje" style="font-size:12px; font-weight:normal">--</span></button>
    </div>
  </div>

  <div class="result">
    <div style="color:#a1a1a6; font-size:15px; margin-bottom: 5px;">Tiempo en el aire: <span id="txtVuelo">0.000</span> seg</div>
    <div class="height-text" id="txtAltura">0.0 cm</div>
    <div style="font-size:13px; font-weight:800; letter-spacing:1.5px; color:#fff;">ALTURA CALCULADA</div>
  </div>

  <script>
    const video = document.getElementById('videoPlayer');
    let tDespegue = null;
    let tAterrizaje = null;

    // Función unificada para manejar la carga del vídeo, ya venga de cámara o galería
    function procesarVideo(e) {
      const file = e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      video.src = url;
      
      // Reiniciar las marcas visuales y lógicas
      tDespegue = null; 
      tAterrizaje = null;
      document.getElementById('txtDespegue').innerText = '--';
      document.getElementById('txtAterrizaje').innerText = '--';
      document.getElementById('txtAltura').innerText = '0.0 cm';
      document.getElementById('txtVuelo').innerText = '0.000';
    }

    // Escuchamos a ambos botones
    document.getElementById('videoCamera').addEventListener('change', procesarVideo);
    document.getElementById('videoGallery').addEventListener('change', procesarVideo);

    // Funciones de cálculo
    function moverVideo(segundos) {
      video.pause();
      video.currentTime += segundos;
    }

    function marcarDespegue() {
      tDespegue = video.currentTime;
      document.getElementById('txtDespegue').innerText = tDespegue.toFixed(3) + 's';
      calcular();
    }

    function marcarAterrizaje() {
      tAterrizaje = video.currentTime;
      document.getElementById('txtAterrizaje').innerText = tAterrizaje.toFixed(3) + 's';
      calcular();
    }

    function calcular() {
      if (tDespegue !== null && tAterrizaje !== null) {
        let tiempoVuelo = tAterrizaje - tDespegue;
        
        if (tiempoVuelo <= 0) {
            alert("El aterrizaje debe ser posterior al despegue.");
            return;
        }
        
        document.getElementById('txtVuelo').innerText = tiempoVuelo.toFixed(3);
        
        // FÓRMULA DE CINEMÁTICA
        let alturaMetros = ((tiempoVuelo * tiempoVuelo) * 9.8) / 8;
        let alturaCm = alturaMetros * 100;
        
        document.getElementById('txtAltura').innerText = alturaCm.toFixed(1) + ' cm';
      }
    }
  </script>
</body>
</html>
